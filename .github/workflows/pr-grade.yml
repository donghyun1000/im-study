# PR이 올라오면 풀이 파일을 자동 채점하고 결과를 PR 코멘트로 남긴다.
name: PR 자동 채점

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 변경된 풀이 파일 채점
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PYTHONIOENCODING: utf-8
        run: |
          git config core.quotepath false
          git diff --name-only --diff-filter=AM "$BASE" "$HEAD" > changed.txt
          cat changed.txt
          mapfile -t FILES < changed.txt
          python .github/scripts/autoreview.py pr "${FILES[@]}" > result.md
          cat result.md

      - name: PR에 결과 코멘트
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --body-file result.md --edit-last \
            || gh pr comment "$PR" --body-file result.md
